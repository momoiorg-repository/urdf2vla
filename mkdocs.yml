# urdf2vla documentation site (MkDocs + Material, English / 日本語)
#   uv pip install -e '.[docs]'
#   mkdocs serve        # http://127.0.0.1:8000 (live reload)
#   mkdocs build --strict
# Pages are Markdown in docs/: page.md = English, page.ja.md = Japanese (falls back to English when missing).
site_name: urdf2vla
site_description: From a robot URDF to a trained Vision-Language-Action model in NVIDIA Isaac Sim, without learning Omniverse first.
# The GitHub Pages workflow sets SITE_URL from the repository's Pages URL; locally it is the `mkdocs serve` address.
site_url: !ENV [SITE_URL, "http://127.0.0.1:8000/"]
repo_url: https://github.com/momoiorg-repository/urdf2vla
repo_name: momoiorg-repository/urdf2vla
edit_uri: edit/main/docs/

docs_dir: docs
exclude_docs: |
  make_media.py
  gen_reference.py
  snippets/

theme:
  name: material
  language: en
  icon:
    logo: material/robot-industrial
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search:
      lang: [en, ja]
  - glightbox:
      zoomable: true
      skip_classes: [no-lightbox]
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
          site_description: ロボットの URDF から、Omniverse を覚えなくても NVIDIA Isaac Sim で VLA モデルを学習するまで。
          nav_translations:
            What urdf2vla does: urdf2vla でできること
            Setup: セットアップ
            Set up on NVIDIA Brev: NVIDIA Brev でセットアップする
            Set up on local Linux: 手元の Linux でセットアップする
            Run the workflow: ワークフローの実行
            Run the Franka tutorial with CLI commands: Franka のチュートリアルを CLI で進める
            Run with Codex or Claude Code: Codex または Claude Code で進める
            Task guides: 作業別ガイド
            Simulate your own robot from a URDF: 自分のロボットを URDF からシミュレーションする
            Inspect robot and camera setup in the browser: ブラウザでロボットとカメラを確認する
            Record training demonstrations: 学習用のデモを記録する
            Fine-tune and evaluate GR00T: GR00T をファインチューニングして評価する
            Published models and datasets: 公開モデルとデータセット
            Troubleshoot setup and pipeline errors: セットアップと各工程のエラーを解決する
            CLI and configuration reference: CLI と設定のリファレンス

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: [docs/snippets]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - What urdf2vla does: index.md
  - Setup:
      - Set up on NVIDIA Brev: guides/brev.md
      - Set up on local Linux: install.md
  - Run the workflow:
      - Run the Franka tutorial with CLI commands: tutorial.md
      - Run with Codex or Claude Code: guides/claude-code.md
  - Task guides:
      - Simulate your own robot from a URDF: guides/your-robot.md
      - Inspect robot and camera setup in the browser: guides/view.md
      - Record training demonstrations: guides/recording.md
      - Fine-tune and evaluate GR00T: guides/training.md
  - Published models and datasets: models.md
  - Troubleshoot setup and pipeline errors: troubleshooting.md
  - CLI and configuration reference: reference.md
