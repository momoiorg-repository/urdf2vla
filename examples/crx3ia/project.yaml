# urdf2vla の例: FANUC CRX-3iA + Robotiq 2F-85（NVIDIA SimReady のグリッパ）
# URDF は FANUC の公式（FANUC-CORPORATION/fanuc_description, Apache-2.0）。同梱していないので、先に取得する:
#   uv pip install xacro                        # xacro（ROS 2 があれば source /opt/ros/jazzy/setup.bash でもよい）
#   bash examples/crx3ia/fetch_urdf.sh          # → examples/crx3ia/fanuc_description/crx3ia.urdf
#   urdf2vla init projects/crx3ia --from examples/crx3ia/project.yaml
# FANUC の URDF にはグリッパがない。NVIDIA SimReady の Robotiq 2F-85 を、FANUC のフランジ座標 fanuc_flange
# （+z がフランジ面から外向き）に取り付ける。configure_robot が取付の位置・向きと手先（TCP）を決め、
# import_robot が Isaac Sim の Robot Assembler で腕に取り付ける。End Effector と指の開く向きの質問は出ない。
name: crx3ia

robot:
  urdf: fanuc_description/crx3ia.urdf
  gripper: {simready: robotiq_2f_85, mount_link: fanuc_flange}

cameras:
  - preset: wrist   # DROID と同じ配置: 手先 + 左右の外部カメラ
  - preset: left
  - preset: right

overrides:
  robot: {}
  task: {}
  cameras: {}
  teleop: {}
